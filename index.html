        body {

            background-color: #ffffff;

        }
        /* پنهان کردن اسکرول‌بار */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* انیمیشن درخشش لوگو */
        @keyframes logo-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(217, 27, 27, 0.2)); }
            50% { filter: drop-shadow(0 0 25px rgba(217, 27, 27, 0.5)); }
        }
        .animate-logo {
            animation: logo-glow 3s infinite ease-in-out;
        }
    </style>
