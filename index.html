        @keyframes logo-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(217, 27, 27, 0.2)); transform: scale(1); }

        .animate-logo { animation: logo-glow 3s infinite ease-in-out; }
        
        /* Custom Map Styles */
